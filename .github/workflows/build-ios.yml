name: Build iPhone IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Arabic fonts (Amiri, Tajawal, Scheherazade New)
        run: bash scripts/fetch-fonts.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OfficialReports.xcodeproj \
            -scheme OfficialReports \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OfficialReports.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/build.log" | sed 's|.*/App/|App/|' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/OfficialReports.xcarchive/Products/Applications/OfficialReports.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/OfficialReports-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/OfficialReports-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficialReports-unsigned-ipa
          path: OfficialReports-unsigned.ipa
          retention-days: 30

      - name: Read app version
        id: version
        run: echo "marketing=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build-{1}', steps.version.outputs.marketing, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('تقاريري {0} (بناء {1})', steps.version.outputs.marketing, github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ملف IPA غير موقّع. افتح الرابط في تطبيق التوقيع (ESign / Feather / Scarlet) ووقّعه بشهادتك.
            رابط ثابت لآخر نسخة دائماً:
            https://github.com/${{ github.repository }}/releases/latest/download/OfficialReports-unsigned.ipa
          files: OfficialReports-unsigned.ipa
