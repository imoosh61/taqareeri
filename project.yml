name: OfficialReports

options:
  bundleIdPrefix: com.imoosh61
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "7"

targets:
  OfficialReports:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleDisplayName: "تقاريري"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "لقفل التطبيق وحماية تقاريرك وتوقيعاتك."
        NSMicrophoneUsageDescription: "يستخدم التطبيق الميكروفون لتحويل كلامك إلى نص داخل التقرير."
        NSSpeechRecognitionUsageDescription: "يستخدم التطبيق التعرّف على الكلام لكتابة التقرير بالإملاء الصوتي."
        NSPhotoLibraryUsageDescription: "لاختيار شعار الجهة أو التوقيع أو الختم من ألبوم الصور."
        NSCameraUsageDescription: "لمسح المستندات والأوراق وإضافتها كشواهد في التقرير."
        UIAppFonts:
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
          - Tajawal-Regular.ttf
          - Tajawal-Bold.ttf
          - ScheherazadeNew-Regular.ttf
          - ScheherazadeNew-Bold.ttf
    settings:
      base:
        PRODUCT_NAME: OfficialReports
        PRODUCT_BUNDLE_IDENTIFIER: com.imoosh61.officialreports
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES

schemes:
  OfficialReports:
    build:
      targets:
        OfficialReports: all
    run:
      config: Debug
    archive:
      config: Release
